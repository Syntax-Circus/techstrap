name: SBOM

# Attaches a CycloneDX SBOM per image to the GitHub Release. publish-nuget.yml creates the Release only after a human approves the
# `release` environment, so this runs when that workflow completes for a tag push instead of waiting for it inside release.yml.
# workflow_run workflows run from the default branch's copy of this file.
on:
  workflow_run:
    workflows: ["Publish NuGet packages"]
    types: [completed]

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM per image, attached to the GitHub Release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.event.workflow_run.head_branch }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Only for release tags
        id: guard
        run: |
          if [[ "$TAG_NAME" =~ ^v[0-9] ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Run is for '$TAG_NAME', not a v* release tag; nothing to attach."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate one SBOM per image
        if: steps.guard.outputs.release == 'true'
        run: |
          version="${TAG_NAME#v}"
          for app in api admin portal worker; do
            # The images job of release.yml runs in parallel with the publish approval; retry briefly in case a push is still finishing.
            for attempt in 1 2 3 4 5; do
              docker run --rm -v "$PWD:/out" -e TRIVY_USERNAME -e TRIVY_PASSWORD \
                aquasec/trivy:0.75.0 image --format cyclonedx --output "/out/sbom-$app.cdx.json" "ghcr.io/syntax-circus/techstrap-$app:$version" && break
              [ "$attempt" -lt 5 ] || exit 1
              sleep 30
            done
          done

      - name: Keep the SBOMs as a workflow artifact
        if: ${{ !cancelled() && steps.guard.outputs.release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json
          if-no-files-found: warn

      - name: Attach the SBOMs to the Release
        if: steps.guard.outputs.release == 'true'
        run: |
          # The Release exists by now (publish-nuget.yml creates it before it completes); the retry covers eventual consistency only.
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG_NAME" sbom-api.cdx.json sbom-admin.cdx.json sbom-portal.cdx.json sbom-worker.cdx.json --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 30
          done
          echo "Could not attach the SBOMs to $TAG_NAME; they remain available as the 'sbom' workflow artifact of this run." >&2
          exit 1
