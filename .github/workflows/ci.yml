name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # Prepare the official Postgres image once, with bounded registry fallback.
      # Testcontainers uses the local alias; no registry is assumed always available.
      TECHSTRAP_TEST_POSTGRES_IMAGE: techstrap-test-postgres:17
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion needs full history

      # Skipped when the secrets are absent (pull requests from forks, Dependabot).
      - name: Log in to Docker Hub (best effort)
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare test Postgres image
        timeout-minutes: 4
        shell: bash
        run: bash scripts/Prepare-TestPostgres.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          # No package lockfiles: invalidate the package cache when restore inputs change.
          cache-dependency-path: |
            global.json
            **/*.props
            **/*.targets
            **/*.csproj
            .config/dotnet-tools.json
            **/[Nn]u[Gg]et.[Cc]onfig

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore TechStrap.CI.slnf

      # Fails on any known-vulnerable direct or transitive package (any severity) and prints the offenders.
      - name: Vulnerable packages (direct and transitive)
        run: |
          dotnet list TechStrap.slnx package --vulnerable --include-transitive --format json --no-restore > vulnerable.json
          if ! jq -e '(.problems // []) == [] and ([.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length == 0)' vulnerable.json; then
            jq '[.projects[] | {path, frameworks: [.frameworks[]? | {framework, top: [.topLevelPackages[]?.id], transitive: [.transitivePackages[]?.id]}]}], .problems' vulnerable.json
            exit 1
          fi

      # Each host runs GitVersion against the same repository. One MSBuild node avoids the Linux named-mutex race seen in parallel builds.
      - name: Build
        run: dotnet build TechStrap.CI.slnf -c Release --no-restore -m:1

      # Testcontainers uses the runner's Docker daemon.
      - name: Test
        run: dotnet test --solution TechStrap.CI.slnf -c Release --no-build

      # The packages are not published from CI yet; this proves they still pack with the README, the MIT license and the intended dependencies.
      - name: Pack dry run (TechStrap.Contracts, TechStrap.Client, TechStrap.Client.Maui)
        shell: pwsh
        run: |
          dotnet pack src/TechStrap.Contracts -c Release --no-build -p:Version=0.0.0-ci -o "${{ runner.temp }}/pack"
          dotnet pack src/TechStrap.Client -c Release --no-build -p:Version=0.0.0-ci -o "${{ runner.temp }}/pack"
          dotnet pack src/TechStrap.Client.Maui -c Release --no-build -p:Version=0.0.0-ci -o "${{ runner.temp }}/pack"
          ./scripts/Test-PackageContents.ps1 -PackageDirectory "${{ runner.temp }}/pack" -Expected @{
              'TechStrap.Contracts' = @()
              'TechStrap.Client'    = @('TechStrap.Contracts', 'SyntaxCircus.Http.Resilience', 'SyntaxCircus.Common', 'Microsoft.Extensions.Http', 'Microsoft.Extensions.Options', 'Microsoft.Extensions.DependencyInjection.Abstractions')
              'TechStrap.Client.Maui' = @('TechStrap.Client', 'TechStrap.Contracts', 'Microsoft.Maui.Essentials', 'Microsoft.Extensions.DependencyInjection.Abstractions', 'Microsoft.Extensions.Options')
          }

      - name: Check for pending EF model changes
        run: dotnet ef migrations has-pending-model-changes --project src/TechStrap.Infrastructure --startup-project src/TechStrap.Api --configuration Release --no-build

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Script tests (package versions, build script, compose files, Dockerfiles, docs)
        shell: pwsh
        run: ./scripts/Invoke-ScriptTests.ps1

  docker-build:
    name: Docker build (amd64, no push)
    runs-on: ubuntu-latest
    # Independent validation: overlap image builds/scans with build-test on a separate runner.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The docker driver uses the daemon's own BuildKit: no BuildKit container is pulled from Docker Hub (see release.yml).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build the four images
        shell: pwsh
        run: ./Build-TechStrapDocker.ps1 -Platforms linux/amd64 -ImageTag "0.0.0-ci.${{ github.run_number }}" -PushLatest:$false

      # Without -Push the script loads each image into the runner's daemon as techstrap-<app>:<tag>-amd64.
      # High and Critical findings with a fix fail the job; waivers live in .trivyignore (see docs/development/RELEASING.md).

      - name: Scan techstrap-api image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: techstrap-api:0.0.0-ci.${{ github.run_number }}-amd64
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan techstrap-admin image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: techstrap-admin:0.0.0-ci.${{ github.run_number }}-amd64
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan techstrap-portal image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: techstrap-portal:0.0.0-ci.${{ github.run_number }}-amd64
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan techstrap-worker image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: techstrap-worker:0.0.0-ci.${{ github.run_number }}-amd64
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  # Started by hand (Actions > CI > Run workflow): it builds four images and starts the whole local stack, so a pull request does not pay for it.
  compose-smoke:
    name: Compose smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start the local stack and check the Api and the Admin
        shell: pwsh
        run: ./scripts/Test-ComposeSmoke.ps1
