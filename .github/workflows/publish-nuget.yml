name: Publish NuGet packages

# Pushing a tag such as v0.1.0 or v0.1.0-rc.1 packs the three TechStrap SDK packages, publishes them to nuget.org with Trusted Publishing (OIDC, no API key secret)
# and creates the GitHub Release. Images for the same tag come from release.yml. A manual run is a dry run: it packs and validates, and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Same as ci.yml: Testcontainers pulls postgres:17 from its ECR Public mirror, no ryuk on an ephemeral runner, best-effort Docker Hub login.
      TECHSTRAP_TEST_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:17
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub (best effort)
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from the tag
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$env:REF_NAME' is not a SemVer release tag (vMAJOR.MINOR.PATCH[-prerelease])."
            }
            $version = $Matches[1]
          } else {
            $version = '0.0.0-dryrun.${{ github.run_number }}'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore TechStrap.CI.slnf

      - name: Build
        run: dotnet build TechStrap.CI.slnf -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # Testcontainers uses the runner's Docker daemon.
      - name: Test
        run: dotnet test --solution TechStrap.CI.slnf -c Release --no-build

      - name: Pack and check the package contents
        shell: pwsh
        run: |
          foreach ($project in 'TechStrap.Contracts', 'TechStrap.Client', 'TechStrap.Client.Maui') {
            dotnet pack "src/$project" -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o "${{ runner.temp }}/pack"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          ./scripts/Test-PackageContents.ps1 -PackageDirectory "${{ runner.temp }}/pack" -Expected @{
              'TechStrap.Contracts' = @()
              'TechStrap.Client'    = @('TechStrap.Contracts', 'SyntaxCircus.Http.Resilience', 'SyntaxCircus.Common', 'Microsoft.Extensions.Http', 'Microsoft.Extensions.Options', 'Microsoft.Extensions.DependencyInjection.Abstractions')
              'TechStrap.Client.Maui' = @('TechStrap.Client', 'TechStrap.Contracts', 'Microsoft.Maui.Essentials', 'Microsoft.Extensions.DependencyInjection.Abstractions', 'Microsoft.Extensions.Options')
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/pack/*.*nupkg
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish to nuget.org and create the GitHub Release
    needs: pack
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: The packed version is the tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = '${{ needs.pack.outputs.version }}'
          foreach ($p in 'TechStrap.Contracts', 'TechStrap.Client', 'TechStrap.Client.Maui') {
            if (-not (Test-Path "artifacts/$p.$v.nupkg")) {
              throw "artifacts/$p.$v.nupkg is missing: the packed version does not match tag $env:REF_NAME."
            }
          }

      - name: NuGet login (Trusted Publishing, OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: "${{ secrets.NUGET_USER }}"

      # The .snupkg symbol packages in the same folder are pushed along with their .nupkg.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: "${{ github.token }}"
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = '${{ needs.pack.outputs.version }}'
          $flags = @()
          if ($v -match '-') { $flags += '--prerelease' }
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Name -match '\.s?nupkg$' } | ForEach-Object { $_.FullName })
          gh release create $env:REF_NAME @files --title "TechStrap $v" --generate-notes --verify-tag @flags
